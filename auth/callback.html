<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Authenticating... - Dystopian Outcasts Wiki</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/benny-32.png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1e3a5f 0%, #2d5f8d 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .callback-container {
      text-align: center;
      max-width: 400px;
    }

    .spinner {
      width: 60px;
      height: 60px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #d4782c;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 2rem;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    p {
      opacity: 0.8;
      font-size: 0.95rem;
    }

    .error {
      background: rgba(245, 101, 101, 0.2);
      border: 1px solid rgba(245, 101, 101, 0.5);
      padding: 1.5rem;
      border-radius: 8px;
      margin-top: 2rem;
    }

    .error h2 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
    }

    .error p {
      margin-bottom: 1rem;
    }

    .back-link {
      margin-top: 1rem;
    }

    .back-link a {
      color: #d4782c;
      text-decoration: none;
    }

    .back-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="callback-container">
    <div class="spinner"></div>
    <h1>Completing sign-in...</h1>
    <p id="status">Please wait while we verify your credentials.</p>
    <div id="error-message"></div>
  </div>

  <script type="module">
    import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'

    // Initialize Supabase client
    const supabaseUrl = 'https://gwubcipchkwthsorhcky.supabase.co'
    const supabaseAnonKey = 'sb_publishable_DSpLY6CC6dpQXK8UhB3tng_R2oRgxfE'
    const supabase = createClient(supabaseUrl, supabaseAnonKey)

    const statusEl = document.getElementById('status')
    const errorEl = document.getElementById('error-message')

    async function handleCallback() {
      try {
        // Get the session from the URL hash
        const { data, error } = await supabase.auth.getSession()

        if (error) {
          throw error
        }

        if (data.session) {
          statusEl.textContent = 'Success! Redirecting to wiki...'

          // Wait a moment so user sees success message
          setTimeout(() => {
            window.location.href = '/'
          }, 1000)
        } else {
          // Check URL for error params
          const params = new URLSearchParams(window.location.search)
          const urlError = params.get('error')
          const urlErrorDesc = params.get('error_description')

          if (urlError) {
            throw new Error(urlErrorDesc || urlError)
          }

          // No session and no error - might be still processing
          statusEl.textContent = 'Verifying authentication...'

          // Try one more time after a brief delay
          setTimeout(async () => {
            const { data: retryData, error: retryError } = await supabase.auth.getSession()

            if (retryError || !retryData.session) {
              throw new Error('Authentication failed. Please try again.')
            }

            window.location.href = '/'
          }, 2000)
        }
      } catch (err) {
        console.error('Auth callback error:', err)

        errorEl.innerHTML = `
          <div class="error">
            <h2>Authentication Failed</h2>
            <p>${err.message}</p>
            <div class="back-link">
              <a href="/auth.html">← Try again</a>
            </div>
          </div>
        `

        // Hide spinner and status
        document.querySelector('.spinner').style.display = 'none'
        statusEl.style.display = 'none'
      }
    }

    // Run callback handler when page loads
    handleCallback()
  </script>
</body>
</html>
