<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="none">
  <!-- Page-edge brush (light mode): soft orange and green strokes at the edges of the window, behind
       everything. Strokes stay out of the middle so no text sits on them. Tune with the opacities. -->
  <defs>
    <filter id="brush" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.006 0.018" numOctaves="3" seed="11" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="150" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="26"/>
    </filter>
  </defs>
  <g filter="url(#brush)">
    <ellipse cx="90" cy="70" rx="330" ry="64" transform="rotate(-24 90 70)" fill="#E2742D" fill-opacity="0.16"/>
    <ellipse cx="10" cy="650" rx="64" ry="300" transform="rotate(8 10 650)" fill="#3F7D2C" fill-opacity="0.14"/>
    <ellipse cx="1430" cy="190" rx="70" ry="280" transform="rotate(-10 1430 190)" fill="#3F7D2C" fill-opacity="0.14"/>
    <ellipse cx="1300" cy="880" rx="320" ry="58" transform="rotate(-16 1300 880)" fill="#E2742D" fill-opacity="0.16"/>
  </g>
</svg>
